<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>单摆物理模拟器 · Week05</title>
<style>
  :root {
    --bg: #1a1a24;
    --panel: rgba(30, 30, 44, 0.74);
    --border: rgba(150, 180, 255, 0.14);
    --text: #e9edff;
    --muted: #8b91ab;
    --accent: #5ad1ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body {
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #panel {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 300px;
    padding: 22px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  #panel h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
  #panel .sub { margin: 0 0 20px; font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }

  .ctrl { margin-bottom: 17px; }
  .ctrl label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 9px;
    font-size: 12.5px;
    color: #c3c9e2;
  }
  .ctrl b {
    font-weight: 500;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.13);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(90, 209, 255, 0.65);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(90, 209, 255, 0.65);
  }

  .section-label {
    margin: 0 0 9px;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .scenes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .cap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 3px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted);
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .cap i {
    font-style: normal;
    font-size: 10px;
    opacity: 0.7;
    font-variant-numeric: tabular-nums;
  }
  .cap:hover { background: rgba(255, 255, 255, 0.09); color: var(--text); }
  .cap.active {
    border-color: rgba(90, 209, 255, 0.55);
    background: rgba(90, 209, 255, 0.14);
    color: var(--accent);
  }
  .cap.active i { opacity: 0.9; }

  .hint {
    margin: -6px 0 14px;
    font-size: 11px;
    line-height: 1.5;
    color: #f0c674;
    min-height: 16px;
  }

  .actions { display: flex; gap: 10px; margin-top: 22px; }  .btn {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.16s ease, background 0.16s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-1px); }
  .btn.primary {
    border: none;
    background: linear-gradient(135deg, #2b8fd6, #5ad1ff);
    color: #07131f;
    font-weight: 600;
  }
  .btn.primary:hover { background: linear-gradient(135deg, #3aa0e8, #74dbff); }

  #panel footer {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    padding-top: 13px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 760px) {
    #panel {
      top: auto;
      right: 12px;
      bottom: 12px;
      left: 12px;
      width: auto;
      padding: 16px;
      border-radius: 14px;
    }
    #panel h1 { font-size: 15px; }
    #panel .sub { display: none; }
    .ctrl { margin-bottom: 13px; }
    .actions { margin-top: 16px; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="scene"></canvas></div>

<aside id="panel">
  <h1>单摆物理模拟器</h1>
  <p class="sub">Week05 · 意图造物与 ReAct 闭环编程</p>

  <p class="section-label">天体场景</p>
  <div class="scenes" id="scenes">
    <button class="cap" data-preset="earth" type="button">地球<i>9.8</i></button>
    <button class="cap" data-preset="moon" type="button">月球<i>1.6</i></button>
    <button class="cap" data-preset="jupiter" type="button">木星<i>24.8</i></button>
    <button class="cap" data-preset="space" type="button">太空<i>0</i></button>
  </div>

  <p class="section-label">参数调节</p>

  <div class="ctrl">
    <label for="lenRange">摆长 L <b id="lenVal">200 px</b></label>
    <input type="range" id="lenRange" min="100" max="350" step="1" value="200" />
  </div>
  <div class="ctrl">
    <label for="gravRange">重力 g <b id="gravVal">9.80 m/s²</b></label>
    <input type="range" id="gravRange" min="0" max="25" step="0.1" value="9.8" />
  </div>
  <div class="ctrl">
    <label for="dampRange">阻尼系数 c <b id="dampVal">0.000</b></label>
    <input type="range" id="dampRange" min="0" max="0.01" step="0.0005" value="0" />
  </div>

  <p class="hint" id="hint"></p>

  <div class="actions">
    <button id="resetBtn" class="btn primary" type="button">重置摆动</button>
    <button id="pauseBtn" class="btn">暂停</button>
  </div>

  <footer>
    <span id="periodOut">T ≈ 2.84 s</span>
    <span id="fpsOut">-- fps</span>
  </footer>
</aside>

<script>
(function () {
  'use strict';

  // 1 米 = 100 像素：保证 g=9.8 时 200px 摆长的周期约 2.8 秒，肉眼可读
  var PX_PER_M = 100;
  // 阻尼滑块量程只有 0~0.010，直接当角速度阻尼几乎看不出衰减，故放大 120 倍做视觉映射
  var DAMPING_K = 120;
  var INIT_ANGLE = Math.PI / 4;

  // 天体预设：g 的单位是 m/s²
  var G_PRESETS = [
    { key: 'earth', name: '地球', g: 9.8 },
    { key: 'moon', name: '月球', g: 1.6 },
    { key: 'jupiter', name: '木星', g: 24.8 },
    { key: 'space', name: '太空', g: 0 }
  ];

  // 本地持久化键名，结构变更时同步升版本号，避免读到旧格式脏数据
  var STORE_KEY = 'week05.pendulum.params.v1';

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');

  var state = {
    L: 200,
    g: 9.8,
    c: 0,
    theta: INIT_ANGLE,
    omega: 0,
    paused: false,
    preset: 'earth',
    targetG: 9.8
  };

  var W = 0;
  var H = 0;
  var trail = [];
  var viewScale = 1;

  var el = {
    len: document.getElementById('lenRange'),
    grav: document.getElementById('gravRange'),
    damp: document.getElementById('dampRange'),
    lenVal: document.getElementById('lenVal'),
    gravVal: document.getElementById('gravVal'),
    dampVal: document.getElementById('dampVal'),
    period: document.getElementById('periodOut'),
    fps: document.getElementById('fpsOut'),
    pause: document.getElementById('pauseBtn'),
    scenes: document.getElementById('scenes'),
    hint: document.getElementById('hint')
  };

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeViewScale();
    trail.length = 0;
    updateReadouts();
  }

  // 窄屏时底部面板会占掉下半屏，按可用高度整体缩放摆长，
  // 视觉尺寸与物理摆长同步缩放，周期读数才不会和画面打架
  function computeViewScale() {
    if (W > 760) {
      viewScale = 1;
      return;
    }
    var avail = H * 0.34;
    viewScale = Math.max(0.4, Math.min(1, avail / 350));
  }

  function pivot() {
    var offset = W > 760 ? 90 : 0;
    return { x: W / 2 - offset, y: H * (W > 760 ? 0.16 : 0.1) };
  }

  function drawnL() {
    return state.L * viewScale;
  }

  // 角加速度：θ″ = −(g/L)·sinθ − c·θ′
  function accel(theta, omega) {
    return -(state.g * PX_PER_M / drawnL()) * Math.sin(theta) - DAMPING_K * state.c * omega;
  }

  // 四阶龙格-库塔积分：长时间摆动也不会"飘"出能量
  function step(dt) {
    var t = state.theta;
    var w = state.omega;
    var k1t = w, k1w = accel(t, w);
    var k2t = w + k1w * dt / 2, k2w = accel(t + k1t * dt / 2, w + k1w * dt / 2);
    var k3t = w + k2w * dt / 2, k3w = accel(t + k2t * dt / 2, w + k2w * dt / 2);
    var k4t = w + k3w * dt, k4w = accel(t + k3t * dt, w + k3w * dt);
    state.theta = t + (k1t + 2 * k2t + 2 * k3t + k4t) * dt / 6;
    state.omega = w + (k1w + 2 * k2w + 2 * k3w + k4w) * dt / 6;
  }

  function draw() {
    var p = pivot();
    var px = p.x;
    var py = p.y;
    var r = drawnL();
    var bx = px + Math.sin(state.theta) * r;
    var by = py + Math.cos(state.theta) * r;

    var bg = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.78);
    bg.addColorStop(0, '#242432');
    bg.addColorStop(1, '#14141b');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 角度参考弧线
    ctx.save();
    ctx.strokeStyle = 'rgba(90, 209, 255, 0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 7]);
    ctx.beginPath();
    ctx.arc(px, py, 72, Math.PI / 2, Math.PI / 2 - state.theta, state.theta > 0);
    ctx.stroke();
    ctx.restore();

    // 运动拖尾：越新的采样点越大越亮
    for (var i = 0; i < trail.length; i++) {
      var a = (i + 1) / trail.length;
      ctx.fillStyle = 'rgba(90, 209, 255, ' + (a * 0.22).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 2 + a * 9, 0, Math.PI * 2);
      ctx.fill();
    }

    // 摆线
    var rod = ctx.createLinearGradient(px, py, bx, by);
    rod.addColorStop(0, 'rgba(150, 190, 255, 0.35)');
    rod.addColorStop(1, 'rgba(150, 225, 255, 0.85)');
    ctx.strokeStyle = rod;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(bx, by);
    ctx.stroke();

    // 悬点
    ctx.fillStyle = '#b9cdf0';
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(185, 205, 240, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, 12, 0, Math.PI * 2);
    ctx.stroke();

    // 发光摆球
    ctx.save();
    ctx.shadowColor = 'rgba(90, 209, 255, 0.85)';
    ctx.shadowBlur = 28;
    var ball = ctx.createRadialGradient(bx - 6, by - 6, 2, bx, by, 21);
    ball.addColorStop(0, '#ffffff');
    ball.addColorStop(0.42, '#a8e8ff');
    ball.addColorStop(1, '#2b8fd6');
    ctx.fillStyle = ball;
    ctx.beginPath();
    ctx.arc(bx, by, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function updateReadouts() {
    el.lenVal.textContent = Math.round(state.L) + ' px';
    el.gravVal.textContent = state.g.toFixed(2) + ' m/s²';
    el.dampVal.textContent = state.c.toFixed(3);

    // 小角近似周期 T = 2π√(L/g)，仅作量级参考；g 趋近 0 时周期趋于无穷
    if (state.g < 0.2) {
      el.period.textContent = 'T → ∞';
    } else {
      var period = 2 * Math.PI * Math.sqrt((drawnL() / PX_PER_M) / state.g);
      el.period.textContent = 'T ≈ ' + period.toFixed(2) + ' s';
    }

    // 失重场景没有回复力，补一句解释，避免被误判成"程序卡死了"
    el.hint.textContent = state.g < 0.2 ? '失重：没有回复力，摆球保持当前运动状态。' : '';
  }

  function clamp(v, lo, hi) {
    return Math.min(hi, Math.max(lo, v));
  }

  function isNum(v) {
    return typeof v === 'number' && isFinite(v);
  }

  function matchPreset(g) {
    for (var i = 0; i < G_PRESETS.length; i++) {
      if (Math.abs(G_PRESETS[i].g - g) < 0.05) return G_PRESETS[i].key;
    }
    return 'custom';
  }

  function syncPresetUI() {
    var caps = el.scenes.querySelectorAll('.cap');
    for (var i = 0; i < caps.length; i++) {
      var on = caps[i].getAttribute('data-preset') === state.preset;
      caps[i].classList.toggle('active', on);
    }
  }

  function setPreset(key) {
    for (var i = 0; i < G_PRESETS.length; i++) {
      if (G_PRESETS[i].key !== key) continue;
      state.preset = key;
      state.targetG = G_PRESETS[i].g; // 只设目标值，由动画循环平滑逼近
      syncPresetUI();
      saveParams();
      return;
    }
  }

  function saveParams() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        L: state.L,
        g: state.g,
        c: state.c,
        preset: state.preset
      }));
    } catch (err) {
      // 无痕模式或存储被禁用时静默降级，不影响主流程
    }
  }

  function loadParams() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (err) {
      return;
    }
    if (!raw) return;

    var saved = null;
    try {
      saved = JSON.parse(raw);
    } catch (err) {
      return;
    }
    if (!saved || typeof saved !== 'object') return;

    // 逐项做类型与范围校验，防止旧缓存或手改数据把状态带崩
    if (isNum(saved.L)) state.L = clamp(saved.L, 100, 350);
    if (isNum(saved.g)) state.g = clamp(saved.g, 0, 25);
    if (isNum(saved.c)) state.c = clamp(saved.c, 0, 0.01);
    state.targetG = state.g;
    state.preset = typeof saved.preset === 'string' ? saved.preset : matchPreset(state.g);

    el.len.value = state.L;
    el.grav.value = state.g;
    el.damp.value = state.c;
  }

  function pushTrail() {
    var p = pivot();
    var r = drawnL();
    trail.push({
      x: p.x + Math.sin(state.theta) * r,
      y: p.y + Math.cos(state.theta) * r
    });
    if (trail.length > 28) trail.shift();
  }

  function resetPendulum() {
    state.theta = INIT_ANGLE;
    state.omega = 0;
    trail.length = 0;
    draw();
  }

  el.len.addEventListener('input', function () {
    state.L = parseFloat(this.value);
    trail.length = 0;
    updateReadouts();
    saveParams();
  });

  el.grav.addEventListener('input', function () {
    state.g = parseFloat(this.value);
    state.targetG = state.g; // 手动拖动立即接管，打断预设过渡
    state.preset = matchPreset(state.g);
    syncPresetUI();
    updateReadouts();
    saveParams();
  });

  el.damp.addEventListener('input', function () {
    state.c = parseFloat(this.value);
    updateReadouts();
    saveParams();
  });

  el.scenes.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.cap') : null;
    if (!btn) return;
    setPreset(btn.getAttribute('data-preset'));
  });

  el.pause.addEventListener('click', function () {
    state.paused = !state.paused;
    el.pause.textContent = state.paused ? '继续' : '暂停';
  });

  // 修复：原先内联 onclick="resetAnimation()" 指向了不存在的函数，
  // 改为在此显式绑定实际已定义的 resetPendulum，作用域清晰且不再依赖全局命名。
  document.getElementById('resetBtn').addEventListener('click', resetPendulum);

  var last = 0;
  var acc = 0;
  var FIXED = 1 / 240;
  var frames = 0;
  var fpsTimer = 0;

  function frame(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.1) dt = 0.1;

    // 天体预设切换：重力向目标值缓动，滑块同步跟随，避免参数瞬间跳变
    if (Math.abs(state.g - state.targetG) > 0.005) {
      state.g += (state.targetG - state.g) * Math.min(1, dt * 6);
      el.grav.value = state.g.toFixed(1);
      updateReadouts();
    } else if (state.g !== state.targetG) {
      state.g = state.targetG;
      el.grav.value = state.g;
      updateReadouts();
    }

    if (!state.paused) {
      acc += dt;
      var guard = 0;
      while (acc >= FIXED && guard < 24) {
        step(FIXED);
        acc -= FIXED;
        guard++;
      }
      if (guard >= 24) acc = 0;
      pushTrail();
    }

    draw();

    frames++;
    fpsTimer += dt;
    if (fpsTimer >= 0.5) {
      el.fps.textContent = Math.round(frames / fpsTimer) + ' fps';
      frames = 0;
      fpsTimer = 0;
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pagehide', saveParams);
  resize();
  loadParams();
  syncPresetUI();
  updateReadouts();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
